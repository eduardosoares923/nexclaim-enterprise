<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexClaim Enterprise - Gestão de Sinistros & Automação de Termos</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 Free Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
            sidebar: '#0f172a'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- SheetJS Excel Library -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- html2pdf & pdf.js for OS & Budget Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window['pdfjsLib']) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <!-- Main Custom CSS -->
  <link rel="stylesheet" href="/legado/css/main.css">
</head>
<body class="bg-slate-50 text-slate-900 antialiased font-sans">

  <!-- Login Screen Container (Inicialmente Visível) -->
  <div id="login-screen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-4 selection:bg-amber-400 selection:text-slate-950">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg border border-slate-200 p-8 space-y-6">
      
      <!-- Header / Brand -->
      <div class="text-center space-y-3">
        <div class="flex justify-center">
          <span class="badge bg-amber-100 text-amber-900 text-[10px] font-black px-2.5 py-1 rounded border border-amber-300 tracking-wider">
            TRANS PINHO GRAVATAÍ/RS
          </span>
        </div>
        <div>
          <h1 class="text-2xl font-black text-slate-900 tracking-tight">
            NexClaim Enterprise
          </h1>
          <p class="text-xs text-slate-500 font-medium mt-1">
            Gestão de Sinistros, Termos Oficiais e Chapeação
          </p>
        </div>
      </div>

      <!-- Error Alert -->
      <div id="login-erro" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold p-3 rounded-lg flex items-center gap-2.5"></div>

      <!-- Form -->
      <form id="login-form" class="space-y-4 text-xs">
        <div class="space-y-1.5">
          <label for="login-email" class="block font-bold text-slate-700">
            E-mail de Acesso
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input
              type="email"
              id="login-email"
              required
              placeholder="seu.email@transpinho.com"
              class="w-full pl-9 pr-3 py-2.5 border border-slate-200 rounded-lg text-xs text-slate-900 bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400 transition"
            />
          </div>
        </div>

        <div class="space-y-1.5">
          <label for="login-senha" class="block font-bold text-slate-700">
            Senha
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input
              type="password"
              id="login-senha"
              required
              placeholder="••••••••"
              class="w-full pl-9 pr-3 py-2.5 border border-slate-200 rounded-lg text-xs text-slate-900 bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400 transition"
            />
          </div>
        </div>

        <button
          type="submit"
          id="login-btn"
          class="w-full mt-2 bg-amber-500 hover:bg-amber-600 active:scale-[0.99] text-slate-950 font-extrabold text-xs py-3 rounded-lg shadow-sm flex items-center justify-center gap-2 transition disabled:opacity-60 cursor-pointer"
        >
          <span>Entrar no Sistema</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="pt-3 border-t border-slate-100 text-center">
        <p class="text-[11px] text-slate-400">
          Acesso restrito aos colaboradores autorizados da Trans Pinho.
        </p>
      </div>
    </div>
  </div>

  <!-- Application Shell Root Container (Oculto até autenticar) -->
  <div id="app" class="flex h-screen overflow-hidden hidden">
    <!-- Rendered dynamically by app.js -->
  </div>

  <!-- Global Modal Container -->
  <div id="modal-root" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <!-- Modals rendered here -->
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-root" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3 max-w-sm pointer-events-none">
    <!-- Toasts rendered here -->
  </div>

  <!-- Firebase & Application Scripts -->
  <script type="module" src="/legado/js/firebase.js"></script>
  <script type="module" src="/legado/js/auth-guard.js"></script>
  <script src="/legado/js/app.js"></script>
</body>
</html>
